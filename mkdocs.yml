site_name: Wiki Arcano & Airy
site_description: Cenário de RPG, HQs e romances — Arcano & Airy, por Rodrigo Mataro
site_url: https://M4T4R0.github.io/wiki-arcano/
docs_dir: docs
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Modo escuro}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Modo claro}
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.path
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
