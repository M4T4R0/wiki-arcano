site_name: Wiki Arcano & Airy
site_url: https://M4T4R0.github.io/wiki-arcano/
docs_dir: '.'
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
    - scheme: slate
      primary: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
nav:
  - Início: index.md
  - Visão Geral: visao-geral.md
  - Lore:
    - Criação: lore/criacao.md
  - Raças:
    - Todas as Raças: races/todas-racas.md
  - Magia:
    - Mana: magic/mana.md
    - Trevas: magic/trevas.md
  - Facções:
    - Império Aba: factions/imperio-aba.md
    - Ordem dos Arcanos: factions/ordem-arcanos-imperiais.md
  - Geografia:
    - Mapa Mundi: geografia/mapa-mundi.md
  - História:
    - Timeline: history/timeline.md
    - Eras: history/eras.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/M4T4R0/r2d2-brain
